name: India Food & Agri Deal Alert

on:
  schedule:
    # Runs every 2 hours (UTC). Adjust as needed.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" trigger from GitHub UI

concurrency:
  group: agri-deal-alert
  cancel-in-progress: false  # let a running job finish rather than being killed mid-run

permissions:
  contents: write  # needed so the workflow can commit seen_deals.json back

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python monitor_agri_deals.py

      - name: Commit updated seen_deals.json
        run: |
          git config user.name "agri-deal-bot"
          git config user.email "actions@github.com"
          git add seen_deals.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen deals log [skip ci]"
          git pull --rebase origin main || true
          git push
